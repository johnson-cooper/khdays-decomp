# Build:   ps2build build           (./build-ps2.sh regenerates the generated parts first)
# Output:  build/bin/khdays-ps2.elf, build/bin/khdays-platform-test.elf
project: khdays-ps2

targets:
  # ---- PS2 platform layer --------------------------------------------------------------
  - name: kh_platform
    type: ee_lib
    sources:
      - ps2/src/platform/*.c
      - ps2/src/gfx/*.c
    include_dirs: [ps2/include, ps2/src/platform]
    headers: [kernel, graph, draw, dma, packet2, pad, audsrv, filexio, patches, debug, eedebug, mc]
    cflags: [-std=gnu11, -Wall, -Wno-unused-function, -Wno-format]

  # ---- NitroSDK / NitroSystem API re-implemented for the PS2 ----------------------------
  - name: kh_nitro
    type: ee_lib
    sources:
      - ps2/src/nitro/*.c
      - ps2/src/audio/*.c
    include_dirs: [ps2/include, ps2/src/nitro]
    headers: [kernel, graph, draw, dma, packet2, pad, audsrv, filexio, patches, debug, eedebug, mc]
    cflags: [-std=gnu11, -Wall, -Wno-unused-function, -Wno-format, -fno-strict-aliasing]

  # ---- platform bring-up test ------------------------------------------------------------
  - name: khdays-platform-test
    type: ee
    sources:
      - ps2/src/bringup/platform_test.c
    include_dirs: [ps2/include]
    cflags: [-std=gnu11, -Wall, -Wno-format]
    libs: [kh_platform, graph, draw, dma, packet2, pad, audsrv, filexio, patches, debug, eedebug, mc, m]
    embed_irx: [sio2man, padman, mcman, mcserv, iomanx, filexio, usbd, bdm, bdmfs_fatfs, usbmass_bd, mmceman, dev9, atad, hdd, fs, libsd, audsrv]

  # ---- PS2 code compiled like game code: function overrides + ABI variants -----------
  - name: kh_ps2game
    type: ee_lib
    sources:
      - ps2/overrides/engine/Fx_Tween.c
      - ps2/overrides/engine/Pad_Sample.c
      - ps2/overrides/engine/main.c
      - ps2/src/abi/*.c
